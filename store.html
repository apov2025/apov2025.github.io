<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Discover independent e-paper products and the people who make them. Real devices, thoughtful details, and a direct connection to the maker." />
  <meta property="og:title" content="Catalog by eink.sg" />
  <meta property="og:description" content="An independent epaper product catalog." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://apov.sg/store.html" />
  <meta property="og:image" content="https://apov.sg/assets/eink-catalog/images/tickey-cutout.png" />
  <link rel="canonical" href="https://apov.sg/store.html" />
  <link rel="icon" href="./assets/eink-catalog/favicon.svg" type="image/svg+xml" />
  <title>Catalog by eink.sg</title>
  <script type="module" crossorigin src="./assets/eink-catalog/store-e23RkbE2.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/eink-catalog/store-DaaHUIBB.css">
</head>
<body>
  <a class="skip-link" href="#collection">Skip to products</a>
  <header class="site-header">
    <h1 class="site-title"><a href="./store.html"><strong>Catalog</strong> <span>by eink.sg</span></a></h1>

  </header>
  <main>
    <section id="collection" class="collection" aria-labelledby="collection-title">
      <h2 id="collection-title" class="sr-only">Products</h2>
      <aside class="catalog-sidebar" aria-label="Catalog controls">
        <div class="sorting" role="group" aria-label="Sort products">
          <button type="button" id="sort-date" class="sort-button" aria-pressed="true" aria-describedby="sort-status">Release date<span class="sort-direction" aria-hidden="true">↓</span></button>
          <button type="button" id="sort-size" class="sort-button" aria-pressed="false" aria-describedby="sort-status">Screen size<span class="sort-direction" aria-hidden="true"></span></button>
        </div>
        <hr>
        <div id="brand-filters" class="brand-filters" role="group" aria-label="Filter by brand"></div>
      </aside>
      <p id="sort-status" class="sr-only" role="status">Release date: newest to oldest.</p>
      <div class="catalog-results"><span id="product-count" class="sr-only" role="status"></span><div id="product-grid" class="product-grid"></div></div>
    </section>
  </main>
  <footer class="site-footer"><span>© 2026 Catalog by eink.sg</span></footer>
  <dialog id="product-dialog" aria-labelledby="product-title"></dialog>
  <noscript><p class="noscript">This collection uses JavaScript to show product cards. You can also visit <a href="https://www.eniacelec.com/pages/ticket">TICKEY’s official product page</a>.</p></noscript>
</body>
</html>
